<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Kiro 账号导入</title>
<!--
  The kiro-custom plugin's file chooser, for magpie in a window or on the
  web. The files are read here, in the browser. The accounts ticked go to
  the plugin's own port on 127.0.0.1 when this browser reaches it, else
  sealed (AES-GCM, the key only in this page's #fragment) through the
  relay the sign-in named, else as an address to paste into magpie.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* one column, a ticket: the drop zone, the accounts as a list, one action */
:root {
  --bg: #f3f4f1;
  --panel: #ffffff;
  --ink: #17201b;
  --muted: #5f6b64;
  --line: #dde2dc;
  --accent: #6d4aff;
  --accent-ink: #ffffff;
  --accent-soft: #ece7ff;
  --ok: #18794e;
  --ok-soft: #e3f4ea;
  --bad: #c4342d;
  --bad-soft: #fbe9e7;
  --font-display: "Bricolage Grotesque", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-body: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1311; --panel: #171c19; --ink: #e8ece9; --muted: #96a29b; --line: #29312c;
    --accent: #9b85ff; --accent-ink: #120c2b; --accent-soft: #241d45;
    --ok: #4cc38a; --ok-soft: #13291e; --bad: #ff7b72; --bad-soft: #321615;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1311; --panel: #171c19; --ink: #e8ece9; --muted: #96a29b; --line: #29312c;
  --accent: #9b85ff; --accent-ink: #120c2b; --accent-soft: #241d45;
  --ok: #4cc38a; --ok-soft: #13291e; --bad: #ff7b72; --bad-soft: #321615;
  color-scheme: dark;
}
* { box-sizing: border-box }
html, body { min-height: 100% }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.65 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: clamp(24px, 6vh, 64px);
}
main { max-width: 34rem; margin: 0 auto; display: grid; gap: 18px }
header { display: grid; gap: 8px }
.mark {
  display: inline-flex; align-items: center; gap: 8px; width: fit-content;
  font: 500 12px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
}
.mark i { width: 8px; height: 8px; border-radius: 2px; background: var(--accent); transform: rotate(45deg) }
h1 { margin: 0; font: 700 clamp(28px, 6vw, 36px)/1.15 var(--font-display); letter-spacing: -.01em; text-wrap: balance }
.lede { margin: 0; color: var(--muted); max-width: 60ch }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius) }

.drop {
  display: grid; place-items: center; gap: 6px; text-align: center; cursor: pointer;
  padding: 34px 18px; border: 1.5px dashed var(--line); border-radius: var(--radius); background: var(--panel);
  transition: border-color .15s, background .15s;
}
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft) }
.drop:focus-within { outline: 2px solid var(--accent); outline-offset: 3px }
.drop .glyph { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent) }
.drop strong { font: 600 16px/1.3 var(--font-display) }
.drop small { color: var(--muted); font-size: 13px }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0 }
.formats { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 6px }
.formats span { font: 12px/1 var(--font-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 5px 9px }

.accounts { padding: 6px 0 }
.accounts-head { display: flex; align-items: center; gap: 12px; padding: 10px 16px 8px; border-bottom: 1px solid var(--line) }
.accounts-head h2 { margin: 0; font: 600 15px/1.3 var(--font-display); flex: 1 }
.accounts-head .count { font: 500 12px/1 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums }
.link-btn { border: 0; background: none; padding: 4px 2px; color: var(--accent); font: inherit; font-size: 13px; cursor: pointer; border-radius: 4px }
#accts { list-style: none; margin: 0; padding: 4px 0; max-height: 46vh; overflow-y: auto }
label.acct {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: center;
  padding: 10px 16px; cursor: pointer;
}
label.acct:hover { background: var(--accent-soft) }
label.acct input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0 }
.acct .who { min-width: 0; overflow-wrap: anywhere; font-weight: 500 }
.acct .from { grid-column: 2; color: var(--muted); font: 12px/1.4 var(--font-mono); overflow-wrap: anywhere }
.chip { grid-row: 1; grid-column: 3; font: 500 11px/1 var(--font-mono); padding: 4px 8px; border-radius: 999px; background: var(--bg); color: var(--muted); border: 1px solid var(--line) }
.chip.off { color: var(--bad); background: var(--bad-soft); border-color: transparent }

.actions { display: grid; gap: 12px }
#ready { margin: 0; color: var(--muted); font-size: 14px }
.primary {
  justify-self: start; display: inline-flex; align-items: center; gap: 10px;
  padding: 12px 22px; border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink);
  font: 600 15px/1 var(--font-display); cursor: pointer; transition: transform .12s, opacity .12s;
}
.primary:hover:not(:disabled) { transform: translateY(-1px) }
.primary:disabled { opacity: .6; cursor: progress }
.primary .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite }
@keyframes spin { to { transform: rotate(360deg) } }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

.note { margin: 0; padding: 12px 14px; border-radius: 10px; font-size: 14px }
.note.err { background: var(--bad-soft); color: var(--bad) }
.note.ok { background: var(--ok-soft); color: var(--ok) }
.note.wait { background: var(--accent-soft); color: var(--ink) }
#paste { display: grid; gap: 10px }
.copy-row { display: flex; gap: 8px }
.copy-row input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); font: 12px var(--font-mono) }
.ghost { padding: 10px 16px; border: 1px solid var(--accent); border-radius: 10px; background: transparent; color: var(--accent); font: 600 14px/1 var(--font-body); cursor: pointer; white-space: nowrap }

.done { display: grid; justify-items: center; gap: 10px; text-align: center; padding: 40px 20px }
.done .tick { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--ok-soft); color: var(--ok) }
.done .tick.bad { background: var(--bad-soft); color: var(--bad) }
.done h2 { margin: 0; font: 700 24px/1.2 var(--font-display); text-wrap: balance }
.done p { margin: 0; color: var(--muted); max-width: 46ch }
.done .later { font: 12px/1.4 var(--font-mono); color: var(--muted) }

footer { color: var(--muted); font-size: 12.5px; display: flex; gap: 8px; align-items: flex-start }
footer svg { flex: none; margin-top: 2px }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
[hidden] { display: none !important }
</style>
</head>
<body>
<main>
  <header>
    <span class="mark"><i></i>magpie · kiro-custom</span>
    <h1>导入 Kiro 账号</h1>
    <p class="lede">选择导出的 JSON 文件，勾选要导入的账号，magpie 会逐个校验后保存。</p>
  </header>

  <p id="bad" class="note err" role="alert" hidden></p>

  <section id="pick">
    <label class="drop" id="drop">
      <span class="glyph" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="m7 9 5-5 5 5"/><path d="M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg></span>
      <strong>选择文件，或拖到这里</strong>
      <small>可以一次选多个 .json 文件</small>
      <span class="formats" aria-label="支持的格式"><span>Kiro Account Manager</span><span>Cockpit</span><span>kiro.rs</span><span>kiro-auth-token.json</span></span>
      <input id="file" type="file" accept=".json,application/json" multiple>
    </label>
  </section>

  <section id="which" class="panel accounts" hidden>
    <div class="accounts-head">
      <h2>要导入的账号</h2>
      <span class="count" id="count"></span>
      <button id="all" class="link-btn" type="button">全选</button>
      <button id="none" class="link-btn" type="button">全不选</button>
    </div>
    <div id="accts"></div>
  </section>

  <section id="go" class="actions" hidden>
    <p id="ready" aria-live="polite"></p>
    <p id="status" class="note" aria-live="polite" hidden></p>
    <button id="open" class="primary" type="button">完成导入</button>
    <div id="paste" hidden>
      <p class="note err" id="far">没能自动交给 magpie（<span id="why"></span>）。地址已经复制好了：回到 magpie，粘贴到登录框下面的地址框，再点「Finish sign-in」。如果 magpie 里的导入已经关掉或超时，请重新开始导入。</p>
      <div class="copy-row">
        <input id="link" readonly aria-label="导入地址">
        <button id="copy" type="button" class="ghost">复制</button>
      </div>
    </div>
  </section>

  <section id="done" class="panel done" hidden aria-live="polite">
    <span class="tick" id="tick" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
    <h2 id="doneTitle"></h2>
    <p id="doneText"></p>
    <span class="later" id="later"></span>
  </section>

  <footer>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    <span>文件只在这个浏览器里读取。magpie 不在这台电脑上时，账号先加密，再经公共中转 ntfy.sh 交给插件；密钥只在这个页面的链接里，中转看不到内容。</span>
  </footer>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id)
  const q = new URLSearchParams(location.search)
  const state = q.get("state") || ""
  let back
  try { back = new URL(q.get("redirect_uri") || "") } catch {}
  // only the plugin's own port on this computer: a link pointing anywhere
  // else would hand someone the accounts
  const good = back && back.protocol === "http:" && back.pathname === "/import" && ["127.0.0.1", "localhost", "[::1]"].includes(back.hostname)
  const fail = (msg) => { $("bad").textContent = msg; $("bad").hidden = false }
  if (!good || !/^[A-Za-z0-9_-]{16,}$/.test(state)) {
    fail("这个页面要从 magpie 的「导入导出的账号（JSON）→ 选择文件…」打开。")
    $("pick").hidden = true
    return
  }
  // the relay and its key, from the fragment the browser never sends
  const frag = new URLSearchParams(location.hash.slice(1))
  let relay = ""
  try { const r = new URL(frag.get("relay") || ""); if (r.protocol === "https:" || r.protocol === "http:") relay = r.href.replace(/\/+$/, "") } catch {}
  const rawKey = frag.get("k") || ""
  // magpie takes a pasted address of 16 KB at most
  const LIMIT = 15000

  let items = [] // {acct, from}
  let packed = ""

  const b64url = (bytes) => {
    let s = ""
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000))
    return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "")
  }
  async function pack(text) {
    const raw = new TextEncoder().encode(text)
    if (typeof CompressionStream === "function") {
      const gz = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer())
      return "g" + b64url(gz)
    }
    return "j" + b64url(raw)
  }

  // an account as the plugin reads it, without what it never keeps (an
  // export's passwords and notes): shorter, and nothing else leaves
  function slim(a) {
    if (!a || typeof a !== "object") return a
    const c = a.credentials || a.auth
    if (!c || typeof c !== "object") return a
    const out = {}
    for (const k of ["email", "nickname", "id", "status", "disabled", "machineId", "profileArn", "idp"]) if (k in a) out[k] = a[k]
    out[a.credentials ? "credentials" : "auth"] = c
    return out
  }
  const accountsIn = (data) => (Array.isArray(data) ? data : Array.isArray(data && data.accounts) ? data.accounts : data && typeof data === "object" ? [data] : [])
  const nameOf = (a, i) => {
    const c = (a && (a.credentials || a.auth)) || a || {}
    return (a && (a.email || a.nickname)) || c.email || (a && a.id) || "账号 " + (i + 1)
  }
  const statusOf = (a) => (a && a.disabled === true ? "disabled" : String((a && a.status) || "active").toLowerCase())
  const usable = (a) => ["active", "normal", "ok", ""].includes(statusOf(a))

  const picked = () => [...document.querySelectorAll("#accts input:checked")].map((r) => items[Number(r.value)].acct)

  async function ready() {
    const list = picked()
    $("bad").hidden = true
    $("count").textContent = `${list.length} / ${items.length}`
    if (!list.length) {
      $("go").hidden = true
      return
    }
    packed = await pack(JSON.stringify(list.map(slim)))
    const url = new URL(back.href)
    url.searchParams.set("state", state)
    url.searchParams.set("d", packed)
    $("link").value = url.href
    $("ready").textContent = `已选 ${list.length} 个，共 ${items.length} 个账号。`
    $("count").textContent = `${list.length} / ${items.length}`
    $("paste").hidden = true
    $("status").hidden = true
    busy(false)
    $("open").onclick = finish
    $("go").hidden = false
  }

  async function read(files) {
    $("bad").hidden = true
    $("go").hidden = true
    const bad = []
    const seen = new Set(items.map((it) => JSON.stringify(it.acct)))
    for (const f of files) {
      let data
      try {
        data = JSON.parse(await f.text())
      } catch (e) {
        bad.push(f.name + "：不是 JSON")
        continue
      }
      const list = accountsIn(data)
      if (!list.length) bad.push(f.name + "：没有账号")
      // the same file twice adds nothing
      for (const acct of list) {
        const k = JSON.stringify(acct)
        if (!seen.has(k)) { seen.add(k); items.push({ acct, from: f.name }) }
      }
    }
    draw()
    if (bad.length) fail(bad.join("；"))
  }

  function draw() {
    const box = $("accts")
    box.textContent = ""
    items.forEach((it, i) => {
      const l = document.createElement("label")
      l.className = "acct"
      const r = document.createElement("input")
      r.type = "checkbox"
      r.value = String(i)
      r.checked = usable(it.acct)
      r.onchange = ready
      const c = (it.acct && (it.acct.credentials || it.acct.auth)) || it.acct || {}
      const who = document.createElement("span")
      who.className = "who"
      who.textContent = nameOf(it.acct, i)
      const chip = document.createElement("span")
      chip.className = "chip" + (usable(it.acct) ? "" : " off")
      chip.textContent = usable(it.acct) ? (c.provider || (c.authMethod === "idc" || c.clientId ? "IdC" : "Social")) : statusOf(it.acct)
      const from = document.createElement("span")
      from.className = "from"
      from.textContent = it.from
      l.append(r, who, chip, from)
      box.append(l)
    })
    $("which").hidden = !items.length
    ready()
  }

  const take = (files) => files && files.length && read([...files])
  $("file").onchange = (e) => { take(e.target.files); e.target.value = "" }
  const drop = $("drop")
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over") }
  drop.ondragleave = () => drop.classList.remove("over")
  drop.ondrop = (e) => {
    e.preventDefault()
    drop.classList.remove("over")
    take(e.dataTransfer.files)
  }
  const tick = (on) => { document.querySelectorAll("#accts input").forEach((r) => (r.checked = on)); ready() }
  $("all").onclick = () => tick(true)
  $("none").onclick = () => tick(false)

  // the plugin's port answers /ping when this browser is on magpie's
  // computer and the import is still waiting
  async function near() {
    try {
      const r = await fetch(new URL("ping", back).href, { cache: "no-store", signal: AbortSignal.timeout(3000) })
      return r.ok
    } catch {
      return false
    }
  }
  // the accounts posted to the port, which answers how it went
  async function viaPort() {
    const url = new URL(back.href)
    url.searchParams.set("state", state)
    const r = await fetch(url.href, { method: "POST", body: packed, headers: { "Content-Type": "text/plain" }, signal: AbortSignal.timeout(120000) })
    return r.json()
  }

  const unb64 = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0))
  async function cryptoKey() {
    return crypto.subtle.importKey("raw", unb64(rawKey), "AES-GCM", false, ["encrypt", "decrypt"])
  }
  async function seal(key, text) {
    const iv = crypto.getRandomValues(new Uint8Array(12))
    const body = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(text)))
    return b64url(iv) + "." + b64url(body)
  }
  async function unseal(key, sealed) {
    const [iv, body] = String(sealed).trim().split(".")
    return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(iv) }, key, unb64(body)))
  }

  // the relay: the sealed accounts go to the topic, and the plugin's
  // answer comes back on <topic>-r
  async function viaRelay() {
    if (!relay || !rawKey || !crypto.subtle) throw new Error("这次导入没有中转")
    const key = await cryptoKey()
    const since = Math.floor(Date.now() / 1000) - 5
    const r = await fetch(relay, { method: "PUT", body: await seal(key, packed), headers: { Filename: "import.txt" }, signal: AbortSignal.timeout(20000) })
    if (!r.ok) throw new Error("中转服务返回 " + r.status)
    say("已加密交给中转，等 magpie 里的插件导入…", "wait")
    const end = Date.now() + 90000
    while (Date.now() < end) {
      const p = await fetch(`${relay}-r/json?poll=1&since=${since}`, { cache: "no-store", signal: AbortSignal.timeout(20000) }).catch(() => null)
      if (p && p.ok) {
        for (const line of (await p.text()).split("\n")) {
          let m
          try { m = JSON.parse(line) } catch { continue }
          if (m.event !== "message") continue
          try { return JSON.parse(await unseal(key, m.message)) } catch {}
        }
      }
      await new Promise((r) => setTimeout(r, 2000))
    }
    throw new Error("magpie 里的插件没有回应：导入可能已经关掉或超时")
  }

  function say(text, cls) {
    $("status").textContent = text
    $("status").className = "note " + (cls || "wait")
    $("status").hidden = false
  }
  function busy(on) {
    const b = $("open")
    b.disabled = on
    b.textContent = on ? "" : "完成导入"
    if (on) {
      const sp = document.createElement("span")
      sp.className = "spin"
      b.append(sp, "正在导入…")
    }
  }

  // the result, in place of the form; a success closes the page after a
  // moment, where the browser lets it (a page magpie opened, not one the
  // person opened by hand: then it says so instead)
  function done(r) {
    for (const id of ["pick", "which", "go", "bad"]) $(id).hidden = true
    $("tick").classList.toggle("bad", !r.ok)
    if (!r.ok) $("tick").innerHTML = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></svg>'
    $("doneTitle").textContent = r.title
    $("doneText").textContent = r.text
    $("done").hidden = false
    if (!r.ok) return
    let n = 3
    const tick = () => {
      if (n > 0) {
        $("later").textContent = `${n} 秒后关闭这个页面`
        n--
        return setTimeout(tick, 1000)
      }
      window.close()
      // still here: the browser keeps a page it didn't open from script
      setTimeout(() => { $("later").textContent = "可以关掉这个页面了" }, 300)
    }
    tick()
  }

  async function finish() {
    busy(true)
    $("bad").hidden = true
    $("paste").hidden = true
    let why
    // this computer: straight to the port
    if (await near()) {
      try {
        return done(await viaPort())
      } catch (e) {
        why = "插件没有回应"
      }
    }
    try {
      return done(await viaRelay())
    } catch (e) {
      why = e.message || String(e)
    }
    $("status").hidden = true
    busy(false)
    if ($("link").value.length > LIMIT) {
      return fail(`没能自动交给 magpie（${why}），而选了 ${picked().length} 个账号放不进一个可粘贴的地址。请少选一些，分几次导入。`)
    }
    $("why").textContent = why
    $("paste").hidden = false
    $("open").textContent = "重试"
    try { await navigator.clipboard.writeText($("link").value) } catch { $("link").select() }
    $("copy").textContent = "已复制"
  }
  $("copy").onclick = async () => {
    try { await navigator.clipboard.writeText($("link").value) } catch { $("link").select(); document.execCommand("copy") }
    $("copy").textContent = "已复制"
  }
})()
</script>
</body>
</html>
